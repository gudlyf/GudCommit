# Keeps SHA-pinned GitHub Actions and Go modules current.
# Dependabot updates the pinned SHA and its "# vX.Y.Z" comment together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /golang
    schedule:
      interval: weekly
    groups:
      aws-sdk:
        patterns: ["github.com/aws/*"]
