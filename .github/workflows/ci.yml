name: CI

on:
  push:
    branches: [ "**" ]
    tags: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

# Least privilege by default; jobs that need more request it explicitly.
permissions:
  contents: read

jobs:
  deps:
    name: Download dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.x'
          cache-dependency-path: golang/go.sum
      - name: Download deps
        run: cd golang && make deps

  fmt:
    name: Format check
    runs-on: ubuntu-latest
    needs: deps
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.x'
          cache-dependency-path: golang/go.sum
      - name: Run go fmt
        run: cd golang && make fmt && git diff --exit-code || (echo "Code is not properly formatted. Please run 'make fmt' and commit the changes." && git diff && exit 1)

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.x'
          cache-dependency-path: golang/go.sum
      - name: Install tools
        run: |
          cd golang
          go mod download
          go mod tidy
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          working-directory: golang
          args: --config .golangci.yml --verbose

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [fmt, lint]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.x'
          cache-dependency-path: golang/go.sum
      - name: Run tests
        run: cd golang && make test

  vulncheck:
    name: Vulnerability check
    runs-on: ubuntu-latest
    needs: deps
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.x'
          cache-dependency-path: golang/go.sum
      - name: govulncheck
        run: cd golang && go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  build:
    name: Build (all platforms)
    runs-on: ubuntu-latest
    needs: [test, vulncheck]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.x'
          cache-dependency-path: golang/go.sum
      - name: Build all
        run: |
          cd golang
          make build-all
          echo "BUILD_VERSION=${GITHUB_REF_NAME}" >> build.env
          echo "BUILD_COMMIT=${GITHUB_SHA}" >> build.env
          echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> build.env
      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gudcommit-binaries
          path: |
            golang/bin/*
            golang/build.env
          if-no-files-found: error
          retention-days: 30

  release:
    name: Create Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    permissions:
      contents: write      # create the release
      id-token: write      # sign build provenance (Sigstore OIDC)
      attestations: write  # store the attestation
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: gudcommit-binaries
          path: dist
      - name: List downloaded artifacts
        run: |
          echo "Listing dist contents:"
          ls -la dist || true
          echo "Listing dist/golang/bin:"
          ls -la dist/golang/bin || true
      - name: Compute release metadata
        id: meta
        shell: bash
        run: |
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Verify checksums
        run: |
          sums=$(find dist -name SHA256SUMS)
          test -n "$sums" || { echo "SHA256SUMS missing from build artifacts"; exit 1; }
          cd "$(dirname "$sums")" && sha256sum -c SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/**/gud*'
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: Release ${{ github.ref_name }}
          body: |
            GudCommit Tools Release ${{ github.ref_name }}

            Binaries Available:
            - gudcommit: Git commit message generator
            - gudchangelog: Changelog generator

            Supported Platforms:
            - Linux (amd64, arm64)
            - macOS (amd64, arm64)
            - Windows (amd64, arm64)

            Verify a download:
            - Checksum: sha256sum -c SHA256SUMS --ignore-missing
            - Provenance: gh attestation verify <file> --repo ${{ github.repository }}

            Build Info:
            - Commit: ${{ github.sha }}
            - Build Date: ${{ steps.meta.outputs.date }}
            - Branch: ${{ github.ref_name }}
          files: |
            dist/**
          fail_on_unmatched_files: true
          draft: false
          generate_release_notes: true

